<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Silung Coffee - Contact Us</title>
  <link href="style.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <script crossorigin="anonymous" src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>
<body>
  <header>
    <nav>
      <div class="hamburger">☰</div>
      <a href="index.html">Home</a>
      <a href="feature.html">Features</a>
      <a href="product.html">Menu</a>
      <a href="contact.html" class="active">Contact Us</a>
      <a href="customer_list.html" class="api-link">Customer List</a>
      <a href="customer_messages.html" class="api-link">Messages</a>
      <a href="sign-up.html">Sign Up</a>
      <div id="user-status"></div>
    </nav>
  </header>

  <section class="hero-section" id="hero-features">
    <div class="hero-content-overlay">
      <h1 class="page-title">CONTACT US</h1>
    </div>
  </section>

  <div class="contact-container">
    <div class="contact-wrapper">
      
      <form class="contact-form" id="contactForm" novalidate="True">
    
        <div class="form-group-contact">
          <label for="name">Name*</label>
          <input type="text" id="name" name="name" required placeholder="Your Full Name">
        </div>
        
        <div class="form-group-contact">
          <label for="email">Email*</label>
          <input type="email" id="email" name="email" required placeholder="example@mail.com">
        </div>
        
        <div class="form-group-contact">
          <label for="marketingType">Select Topic</label>
          <select id="marketingType" name="marketingType">
            <option value="General Inquiry">General Inquiry</option>
            <option value="Customer Feedback">Customer Feedback</option>
            <option value="Email Marketing">Email Marketing</option>
            <option value="Social Media Marketing">Social Media Marketing</option>
          </select>
        </div>
        
        <div class="form-group-contact">
          <label for="message">Message*</label>
          <textarea id="message" name="message" rows="4" required placeholder="Your message..."></textarea>
        </div>

        <div class="form-group-contact">
          <button type="submit">Send Message</button>
        </div>
      </form>

      <aside class="contact-info">
        <section class="location-details">
          <h3>Our Location</h3>
          <p>Silung Coffee</p>
          <p>MacArthur Hwy, Mabalacat City, Pampanga</p>
        </section>

        <div aria-label="Social links" class="socials">
          <a href="#"><i class="fab fa-facebook-f"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-tiktok"></i></a>
        </div>

        <iframe 
          class="map-embed"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3849.7725750328505!2d120.57321379999999!3d15.2256073!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3396ed004be7b937%3A0xc35f27c9da38e589!2sSilung%20Coffee!5e0!3m2!1sen!2sph!4v1760877427893!5m2!1sen!2sph" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </aside>
    </div>
  </div>

  <div id="message-container"></div>
  
  <footer>
    <div class="footer-socials">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-tiktok"></i></a>
    </div>
    <p>&copy; 2024 Silung Coffee. All rights reserved.</p>
  </footer>

  <script>
    /**
     * Notification/Message Function (For "data received" status)
     * This uses the standard floating notification style in your style.css
     */
    function showStandardMessage(text, type = 'success') {
        const container = document.getElementById('message-container');
        let messageBox = document.createElement('div');
        messageBox.className = `message-box ${type}`;
        messageBox.textContent = text;
        container.appendChild(messageBox);

        // Trigger the fade-in effect (relies on CSS transition)
        setTimeout(() => {
            messageBox.classList.add('show');
        }, 10);

        // Hide and remove the message after 3 seconds
        setTimeout(() => {
            messageBox.classList.remove('show');
            setTimeout(() => {
                messageBox.remove();
            }, 500); // Wait for the fade-out transition to finish
        }, 3000);
    }
    
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('contactForm');
        const nav = document.querySelector('nav');
        const burger = document.querySelector('.hamburger');

        // Hamburger menu toggle
        burger.addEventListener('click', () => {
            nav.classList.toggle('nav-open');
        });

        // Form Submission with localStorage for Customer Messages
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            // Simple validation check for required fields (Name, Email, Message)
            if (!form.name.value || !form.email.value || !form.message.value) {
                showStandardMessage('Please fill in all required fields.', 'error');
                return;
            }

            const messageData = {
                id: Date.now(), // Unique ID based on timestamp
                name: form.name.value,
                email: form.email.value,
                message: form.message.value,
                date: new Date().toISOString().slice(0, 10),
                status: 'New'
            };

            // 1. Save the new message to localStorage
            let submittedMessages = JSON.parse(localStorage.getItem('submittedMessagesData')) || [];
            submittedMessages.push(messageData);
            localStorage.setItem('submittedMessagesData', JSON.stringify(submittedMessages));

            // 2. Display success message to the user ("data received" notification)
            const marketingType = form.marketingType.value;
            const successText = `Thank you, ${form.name.value}! Your message has been received and logged in our system.`;
            showStandardMessage(successText, 'success');

            // 3. Simulate redirection for marketing inquiries
            if (marketingType === 'Email Marketing' || marketingType === 'Social Media Marketing') {
                setTimeout(() => {
                    // Navigate to the correct mockup page
                    window.location.href = (marketingType === 'Email Marketing' ? 'customer_list.html' : 'customer_messages.html');
                }, 1500); // Wait for message to show before redirecting
            }

            // 4. Reset the form
            form.reset();
        });
    });
</script>
</body>
</html>
