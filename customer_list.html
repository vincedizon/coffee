<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer List - Silung Coffee</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
    <header>
        <nav>
            <div class="hamburger">☰</div>
            <a href="index.html">Home</a>
            <a href="feature.html">Features</a>
            <a href="product.html">Menu</a>
            <a href="contact.html">Contact Us</a>
            <a href="customer_list.html" class="active api-link">Customer List</a>
            <a href="customer_messages.html" class="api-link">Messages</a>
            <a href="sign-up.html">Sign Up</a>
            <div id="user-status"></div>
        </nav>
    </header>

    <div class="data-page">
        <h1>Customer List</h1>

        <div class="data-search-container">
            <input type="text" id="search-input" placeholder="Search by Name, Email, or City...">
        </div>
        
        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>City</th>
                        <th>Sign Up Date</th>
                    </tr>
                </thead>
                <tbody id="customer-data-body">
                    </tbody>
            </table>
        </div>
    </div>

   <script>
    // Mock Customer Data (Simulating RESTful API GET /api/customers)
    const mockCustomerData = [
        { id: 101, name: "Maria Santos", email: "maria.s@example.com", city: "Mabalacat", signupDate: "2024-01-15" },
        { id: 102, name: "Jose Cruz", email: "j.cruz@web.ph", city: "Angeles City", signupDate: "2024-02-20" },
        { id: 103, name: "Elaine Wong", email: "elaine.wong@mail.com", city: "Clark Freeport", signupDate: "2024-03-10" },
        { id: 104, name: "Ben Sison", email: "b.sison@coffee.ph", city: "Mabalacat", signupDate: "2024-04-05" },
        { id: 105, name: "Anna Reyes", email: "anna.r@email.com", city: "San Fernando", signupDate: "2024-05-18" }
    ];

    // NEW: Function to load all data, including dynamic additions
    function loadAllCustomerData() {
        // Retrieve customers submitted via the checkout in product.html
        const submittedCustomers = JSON.parse(localStorage.getItem('submittedCustomers')) || [];
        
        // Combine the mock data with the dynamically submitted data
        // Use a Set to ensure no immediate duplicates (useful if we refresh the data)
        let combinedData = [...mockCustomerData];
        submittedCustomers.forEach(customer => {
             // Check if the submitted customer's ID is already in the mock data (unlikely, but safe)
            if (!combinedData.some(c => c.id === customer.id)) {
                combinedData.push(customer);
            }
        });

        return combinedData;
    }

    function renderCustomerTable(data) {
        const tbody = document.getElementById('customer-data-body');
        tbody.innerHTML = ''; 

        data.forEach(customer => {
            const row = tbody.insertRow();
            row.innerHTML = `
                <td>${customer.id}</td>
                <td>${customer.name}</td>
                <td>${customer.email}</td>
                <td>${customer.city}</td>
                <td>${customer.signupDate}</td>
            `;
        });
    }
    
    // Search functionality
    document.addEventListener('DOMContentLoaded', function() {
        // Load combined data
        const allCustomerData = loadAllCustomerData();
        renderCustomerTable(allCustomerData);

        // Hamburger menu toggle (if not already included in the body)
        const nav = document.querySelector('nav');
        const burger = document.querySelector('.hamburger');
        burger.addEventListener('click', () => {
            nav.classList.toggle('nav-open');
        });

        // Search logic now uses the combined data
        document.getElementById('search-input').addEventListener('keyup', function(e) {
            const query = e.target.value.toLowerCase();
            const combinedData = loadAllCustomerData(); // Reload all data to search the latest list
            
            const filteredData = combinedData.filter(customer => 
                customer.name.toLowerCase().includes(query) ||
                customer.email.toLowerCase().includes(query) ||
                customer.city.toLowerCase().includes(query)
            );
            renderCustomerTable(filteredData);
        });
    });
</script>
</body>
</html>
