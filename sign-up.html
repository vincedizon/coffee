<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Local Business</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #1E392A;
      color: #FEFAE0;
    }

    body.auth-page {
      display: flex;
      padding: 10px;
      margin-top: 20px;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1E392A;
    }

    /* Auth Modal Styles (adapted for the main page) */
    .auth-modal-content {
      background-color: #2F3D2D;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 400px;
      color: #FEFAE0;
      text-align: center;
    }

    .auth-modal-content h2 {
      font-family: 'Playfair Display', serif;
      color: #E9CBA7;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .auth-modal-content form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .auth-modal-content label {
      text-align: left;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .auth-modal-content input[type="text"],
    .auth-modal-content input[type="email"],
    .auth-modal-content input[type="password"],
    .auth-modal-content input[type="date"],
    .auth-modal-content input[type="tel"],
    .auth-modal-content textarea {
      padding: 12px;
      border: 1px solid #555;
      border-radius: 5px;
      background-color: #1E392A;
      color: #FEFAE0;
      font-size: 16px;
      width: calc(100% - 24px); /* Account for padding */
    }

    .auth-modal-content input[type="text"]:focus,
    .auth-modal-content input[type="email"]:focus,
    .auth-modal-content input[type="password"]:focus,
    .auth-modal-content input[type="date"]:focus,
    .auth-modal-content input[type="tel"]:focus,
    .auth-modal-content textarea:focus {
      outline: none;
      border-color: #FFDBA4;
      box-shadow: 0 0 5px rgba(255, 219, 164, 0.5);
    }

    .auth-modal-content button[type="submit"] {
      background-color: #FFDBA4;
      color: #1E392A;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .auth-modal-content button[type="submit"]:hover {
      background-color: #E9CBA7;
      transform: translateY(-2px);
    }

    /* sign up page */
    .signup-wrapper {
      display: flex;
      flex-direction: row;
      gap: 80px;
      padding: 80px;
      background-color: #2F3D2D;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      color: #FEFAE0;
      max-width: 1200px;
      margin: auto;
    }
    .signup-form {
      flex: 1;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      background-color: #FEFAE0;
      color: #1E392A;
    }
    .form-group input[type="checkbox"] {
      width: auto;
    }
    .gender-group {
      display: flex;
      gap: 20px;
      align-items: center;
      padding: 8px 0;
    }
    .gender-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: normal;
    }
    .form-buttons {
      display: flex;
      justify-content: space-between;
    }
    .form-buttons button {
      padding: 10px 20px;
      font-weight: bold;
      background-color: #FFDBA4;
      color: #1E392A;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .form-buttons button:hover {
      background-color: #E9CBA7;
    }
    .output-box {
      flex: 1;
      background-color: #1E392A;
      border-left: 2px solid #FFDBA4;
      padding: 20px;
      border-radius: 8px;
      overflow-y: auto;
    }
    .output-box h3 {
      font-family: 'Playfair Display', serif;
      color: #E9CBA7;
      margin-top: 0;
    }
    .toggle-password {
      margin-top: 5px;
      display: block;
      font-size: 12px;
      cursor: pointer;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .signup-wrapper {
        flex-direction: column;
        padding: 20px;
        gap: 40px;
      }
      .output-box {
        border-left: none;
        border-top: 2px solid #FFDBA4;
      }
    }
  </style>
</head>
<body class="auth-page">
  <div class="signup-wrapper">
    <form class="signup-form" id="userForm">
      <h2>Customer Sign Up</h2>
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" required />
      </div>
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" required />
      </div>
      <div class="form-group">
        <label>Gender</label>
        <div class="gender-group">
          <label><input type="radio" name="gender" value="Male" required /> Male</label>
          <label><input type="radio" name="gender" value="Female" /> Female</label>
          <label><input type="radio" name="gender" value="Other" /> Other</label>
        </div>
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label for="contact">Contact Number</label>
        <input type="tel" id="contact" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" />
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
        <span class="toggle-password" onclick="togglePassword()">Show/Hide Password</span>
      </div>
      <div class="form-buttons">
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </div>
    </form>

    <div class="output-box">
      <h3>Submitted Data</h3>
      <div id="displayArea">
        <p>Your submitted information will appear here.</p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('userForm');
    const displayArea = document.getElementById('displayArea');

    // Function to show a custom message box instead of alert()
    function showMessage(message, type = 'info') {
      const messageBox = document.createElement('div');
      messageBox.className = `message-box ${type}`;
      messageBox.textContent = message;
      document.body.appendChild(messageBox);

      // Fade in and out
      setTimeout(() => {
        messageBox.style.opacity = '1';
      }, 10);

      setTimeout(() => {
        messageBox.style.opacity = '0';
        setTimeout(() => {
          messageBox.remove();
        }, 500);
      }, 3000);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const data = {
        firstName: form.firstName.value,
        lastName: form.lastName.value,
        gender: form.gender.value,
        address: form.address.value,
        contact: form.contact.value,
        email: form.email.value,
        dob: form.dob.value,
        username: form.username.value,
        password: form.password.value
      };

      displayArea.innerHTML = `
        <p><strong>First Name:</strong> ${data.firstName}</p>
        <p><strong>Last Name:</strong> ${data.lastName}</p>
        <p><strong>Gender:</strong> ${data.gender}</p>
        <p><strong>Address:</strong> ${data.address}</p>
        <p><strong>Contact:</strong> ${data.contact}</p>
        <p><strong>Email:</strong> ${data.email}</p>
        <p><strong>Date of Birth:</strong> ${data.dob}</p>
        <p><strong>Username:</strong> ${data.username}</p>
        <p><strong>Password:</strong> ${data.password}</p>
      `;

      showMessage('Form submitted successfully!', 'success');
      form.reset();
    });

    function togglePassword() {
      const passwordField = document.getElementById("password");
      if (passwordField.type === "password") {
        passwordField.type = "text";
      } else {
        passwordField.type = "password";
      }
    }
  </script>
</body>
</html>
