<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silung Coffee - Menu</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <nav>
      <div class="hamburger">&#9776;</div>
      <a href="index.html">Home</a>
      <a href="feature.html">Features</a>
      <a href="product.html" class="active">Menu</a>
      <a href="contact.html">Contact Us</a>
      <a href="customer_list.html" class="api-link">Customer List</a>
      <a href="customer_messages.html" class="api-link">Messages</a>
      <a href="sign-up.html">Sign Up</a>
      <div id="user-status"></div>
    </nav>
  </header>

  <section class="hero-section" id="hero-features">
    <div class="hero-content-overlay">
      <h1 class="page-title">OUR MENU</h1>
    </div>
  </section>

  <div class="product-page">
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search for products or category...">
    </div>
    
    <div class="cart-summary">
        Cart Total: <span id="cart-total">P0.00</span>
        <button class="delete-cart-btn" onclick="clearCart()">Delete Cart</button>
        <button class="delete-cart-btn" style="background-color: #4CAF50;" onclick="checkout()">Checkout</button>
    </div>

    <div id="product-list-container">
        </div>
  </div>

  <div id="message-container"></div>
  
  <footer>
    <div class="footer-socials">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-tiktok"></i></a>
    </div>
    <p>&copy; 2024 Silung Coffee. All rights reserved.</p>
  </footer>

  <script>
    // Mock Product Data (Simulating RESTful API GET /api/products)
    const productsData = [
      { name: "Silung Black", description: "espresso, water, tiramisu foam", price: 140.00, category: "Signature Drinks" },
      { name: "Silung White", description: "espresso, milk, tiramisu foam", price: 140.00, category: "Signature Drinks" },
      { name: "Spanish Latte", description: "espresso, condensed milk", price: 130.00, category: "Signature Drinks" },
      { name: "Seasalt Latte", description: "espresso, milk, sea salt foam", price: 130.00, category: "Signature Drinks" },
      { name: "Biscoff Latte", description: "espresso, milk, biscoff spread, foam", price: 140.00, category: "Signature Drinks" },
      { name: "Mocha", description: "espresso, milk, dark chocolate", price: 130.00, category: "Classics" },
      { name: "White Mocha", description: "espresso, milk, white chocolate", price: 130.00, category: "Classics" },
      { name: "Cappuccino", description: "espresso, milk, foam", price: 120.00, category: "Classics" },
      { name: "Americano", description: "espresso, water", price: 120.00, category: "Classics" },
      { name: "Matcha", description: "matcha, milk", price: 130.00, category: "Non-Espresso & Refreshers" },
      { name: "Croissant", description: "Classic French butter croissant", price: 120.00, category: "Pastries" },
      { name: "Choco Chip Cookie", description: "A large, gooey chocolate chip cookie", price: 80.00, category: "Pastries" }
    ];

    // Shopping Cart Simulation 
    let cart = JSON.parse(localStorage.getItem('coffeeCart')) || [];
    
    function saveCart() { localStorage.setItem('coffeeCart', JSON.stringify(cart)); }

    function calculateTotal() {
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById('cart-total').textContent = `P${total.toFixed(2)}`;
        return total;
    }

    function showMessage(text, type = 'success') {
        const container = document.getElementById('message-container');
        let messageBox = document.createElement('div');
        messageBox.className = `message-box ${type}`;
        messageBox.textContent = text;
        container.appendChild(messageBox);
        setTimeout(() => {
            messageBox.classList.add('show');
        }, 10);
        setTimeout(() => {
            messageBox.classList.remove('show');
            setTimeout(() => {
                messageBox.remove();
            }, 500);
        }, 3000);
    }

    function addToCart(productName) {
        const product = productsData.find(p => p.name === productName);
        if (product) {
            cart.push({ name: product.name, price: product.price });
            saveCart();
            calculateTotal();
            showMessage(`${product.name} added to cart!`);
        }
    }

    function clearCart() {
        cart = [];
        saveCart();
        calculateTotal();
        showMessage('Cart cleared.', 'error');
    }
    
    // UPDATED: Checkout Function now saves customer data to localStorage
    function checkout() {
        const total = calculateTotal();

        if (total === 0) {
            showMessage("Your cart is empty! Add items to checkout.", 'error');
            return;
        }

        // 1. Simulate data capture for the Customer List page
        const customerName = prompt("Please enter your name for the order confirmation:");
        if (!customerName) {
            showMessage("Checkout cancelled.", 'error');
            return;
        }
        const customerEmail = prompt("Please enter your email:");
        if (!customerEmail) {
            showMessage("Checkout cancelled.", 'error');
            return;
        }

        // 2. Prepare new customer record
        const newCustomer = {
            name: customerName,
            email: customerEmail,
            // Simple default values for other required fields
            city: "Online Order", 
            signupDate: new Date().toISOString().slice(0, 10),
            id: Date.now() // Unique ID based on timestamp
        };
        
        // 3. Store the new customer data in localStorage
        let submittedCustomers = JSON.parse(localStorage.getItem('submittedCustomers')) || [];
        submittedCustomers.push(newCustomer);
        localStorage.setItem('submittedCustomers', JSON.stringify(submittedCustomers));

        
        // Final confirmation and notification (Product Received)
        showMessage(`Order successfully submitted! Total: P${total.toFixed(2)}. Your order has been received.`, 'success');
        
        // Clear the cart after successful checkout
        cart = [];
        saveCart();
        calculateTotal();
    }
    
    function renderProductList(data) {
        // ... (rest of the renderProductList function is unchanged)
        const container = document.getElementById('product-list-container');
        container.innerHTML = ''; 

        // Group products by category
        const categories = data.reduce((acc, product) => {
            if (!acc[product.category]) {
                acc[product.category] = [];
            }
            acc[product.category].push(product);
            return acc;
        }, {});

        // Render each category section
        for (const category in categories) {
            const section = document.createElement('div');
            section.className = 'product-section';
            section.innerHTML = `<h3>${category}</h3><ul class="product-list"></ul>`;
            
            const ul = section.querySelector('.product-list');

            categories[category].forEach(product => {
                const li = document.createElement('li');
                li.className = 'product-item';
                
                li.innerHTML = `
                    <div class="product-details">
                        <span class="product-name">${product.name}</span>
                        <p class="product-description">${product.description}</p>
                    </div>
                    <span class="product-price">P${product.price.toFixed(2)}</span>
                    <div class="product-actions">
                        <div class="rating-system"><span class="rating-icon">&#x2615;</span></div>
                        <button onclick="addToCart('${product.name}')">Add to cart</button>
                    </div>
                `;
                ul.appendChild(li);
            });

            container.appendChild(section);
        }
    }

    // E. API Integration: Search Feature
    document.addEventListener('DOMContentLoaded', function() {
        // Initial render simulating API GET call on load
        renderProductList(productsData);
        calculateTotal();

        // Hamburger menu toggle
        const nav = document.querySelector('nav');
        const burger = document.querySelector('.hamburger');
        burger.addEventListener('click', () => {
            nav.classList.toggle('nav-open');
        });

        // Search logic
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('keyup', function(e) {
            const query = e.target.value.toLowerCase();
            const filteredProducts = productsData.filter(product => 
                product.name.toLowerCase().includes(query) || 
                product.description.toLowerCase().includes(query) ||
                product.category.toLowerCase().includes(query)
            );
            renderProductList(filteredProducts);
        });
    });
</script>
  <button class="delete-cart-btn" style="background-color: #4CAF50;" onclick="checkout()">Checkout</button>
  
</body>
</html>
